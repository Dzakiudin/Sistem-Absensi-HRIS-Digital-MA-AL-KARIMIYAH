# Di-load dari dalam blok http {}, jadi map() boleh di sini.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker embedded DNS. Dipakai supaya host di-resolve ulang tiap request:
# kalau container backend di-recreate dan IP-nya berubah, nginx ikut adjusts
# tanpa perlu restart.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name absensimakarimiyah.tech www.absensimakarimiyah.tech;

    # Balas tantangan certbot dulu, baru sisanya dialihkan ke HTTPS.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# Fallback lewat IP (srv2019002.hstgr.cloud / 76.13.17.167). Tetap HTTP
# supaya ada jalan keluar kalau sertifikat HTTPS bermasalah. Dialihkan ke
# HTTPS kalau host yang diminta adalah domain di atas.
#
# WAJIB default_server: tanpa itu blok domain di atas yang jadi default
# (nginx memakai blok pertama), sehingga request ber-Host IP ikut kena
# redirect ke https://76.13.17.167 yang tidak punya sertifikat.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Body limit Fiber di backend = 20MB, sisakan sedikit ruang.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Health check nginx sendiri, untuk uptime monitor dari luar.
    # Nginx hidup? Tidak menyentuh service lain, jadi membedakan
    # "proxy mati" dari "backend mati".
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Dipakai saat penerbitan sertifikat certbot (HTTP-01).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------------------------------------------------------------------
    # Health check backend, untuk uptime monitor dari luar VPS.
    # /readyz hanya 200 kalau koneksi PostgreSQL masih hidup — itu yang
    # berguna dipantau, karena /health tetap 200 walau DB sudah jatuh.
    # ---------------------------------------------------------------------
    location = /health {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        access_log off;
    }

    location = /readyz {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Go backend. app.js memanggil '/api/rpc' dan '/api/log' secara relatif,
    # jadi browser selalu same-origin -> CORS tidak pernah tersentuh.
    # ---------------------------------------------------------------------
    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Nginx is the only public proxy; overwrite client-supplied values so
        # the backend can trust this address for per-visitor rate limiting.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
        proxy_buffering off;
    }

    # Foto absensi (backend: GET /uploads/foto/:file). Jangan di-cache agresif:
    # nama file mengandung timestamp, tapi foto absen tidak boleh berubah
    # di mata browser yang masih menyimpan versi lama.
    location /uploads/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------
    # Next.js (standalone). Semua request lain jatuh ke sini.
    # ---------------------------------------------------------------------
    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 60s;
    }
}

# =====================================================================
# HTTPS
# Sertifikat diterbitkan certbot lewat HTTP-01, disimpan di
# nginx/certbot/conf/live/absensimakarimiyah.tech/.
# Perbarui otomatis: docker compose exec certbot renew --quiet
# =====================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name absensimakarimiyah.tech www.absensimakarimiyah.tech;

    ssl_certificate     /etc/letsencrypt/live/absensimakarimiyah.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/absensimakarimiyah.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # Lokasi yang sama persis dengan server HTTP di atas. Lihat blok itu
    # untuk penjelasan tiap location.
    # ---------------------------------------------------------------------
    location = /health {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        access_log off;
    }

    location = /readyz {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        access_log off;
    }

    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 60s;
    }

    location /uploads/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Foto absensi tidak diubah saat lewat, jadi aman di-cache lama.
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 60s;
    }
}
