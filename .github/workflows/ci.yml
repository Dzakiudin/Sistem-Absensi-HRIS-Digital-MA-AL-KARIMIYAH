name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: paspapan_test
          POSTGRES_USER: paspapan
          POSTGRES_PASSWORD: paspapan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paspapan -d paspapan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://paspapan:paspapan_test@localhost:5432/paspapan_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Initialize integration-test database
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file backend/db/schema.sql

      - name: Run Go static analysis and unit tests
        working-directory: backend
        run: |
          go vet ./...
          go test ./...

      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: go test -tags integration ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application bundle
        working-directory: frontend
        run: npm run build:app

      - name: Lint classic frontend scripts
        working-directory: frontend
        run: npx eslint src/js

      - name: Validate frontend artifacts
        working-directory: frontend
        run: |
          node --check public/app.js
          npm run validate:html

      - name: Build frontend
        working-directory: frontend
        run: npm run build
