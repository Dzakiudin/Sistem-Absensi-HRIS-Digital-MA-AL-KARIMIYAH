name: paspapan

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?wajib isi .env}
      POSTGRES_USER: ${POSTGRES_USER:?wajib isi .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib isi .env}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    # shared_buffers 128MB cukup untuk VPS 2GB. Naikkan hanya kalau RAM >= 4GB.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=60
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Hanya dijalankan saat pgdata masih kosong (bootstrap pertama).
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      # Honor cache 60 detik -> cache ini disposable, jadi TTL pendek cukup.
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Jakarta

      JWT_SECRET: ${JWT_SECRET:?wajib isi .env - minimal 32 karakter}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}

      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      # Default config (25/5) terlalu besar untuk VPS 2GB. Naikkan lewat .env bila RAM >= 4GB.
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}

      REDIS_URL: redis://redis:6379

      # Browser cuma pernah gerak same-origin lewat Nginx, jadi cukup domain kita.
      ALLOWED_ORIGINS: https://${DOMAIN:?wajib isi .env}

      RPC_TIMEOUT_SEC: "15"
      HTTP_READ_TIMEOUT_SEC: "30"
      HTTP_WRITE_TIMEOUT_SEC: "30"
      HTTP_IDLE_TIMEOUT_SEC: "60"
      HONOR_CACHE_SEC: "60"
      SLOW_QUERY_MS: "500"
      APP_PPROF: "false"
    # uid/gid harus sama dengan user `app` di backend/Dockerfile (10001).
    # Kalau diganti di sini, ganti juga ARG/adduser di Dockerfile.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    volumes:
      # Foto absensi. Bind mount supaya file langsung ada di host dan mudah
      # di-backup manual di luar Docker.
      #
      # PENTING: host akan membuat folder ini root:root kalau belum ada, lalu
      # container non-root tidak bisa menulis -> upload foto gagal tanpa error
      # (service.go:499 membuang nilai balik MkdirAll). Folder .gitkeep di repo
      # mencegah folder hilang, tapi owner di host tetap harus dicocokkan:
      #   chown -R 10001:10001 backend/storage
      - ./backend/storage:/app/storage
    # Hanya bind ke loopback: untuk debug via SSH tunnel
    # (`ssh -L 8080:127.0.0.1:8080 user@vps`), bukan untuk diakses publik.
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    init: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Jakarta
    expose:
      - "3000"
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    networks: [internal]

  # pg_dump harian. Auto-backup Hostinger = snapshot VM (bagus untuk pemulihan
  # besar), tapi snapshot juga menyimpan kondisi database yang sudah rusak.
  # Ini lapisan kedua yang khusus melindungi data.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: Asia/Jakarta
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    command:
      - sh
      - -c
      - |
        echo "Backup service aktif. Dump pertama dijalankan langsung."
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          out="/backups/$${PGDATABASE}_$${ts}.dump"
          if pg_dump -Fc -f "$$out"; then
            echo "[backup] ok: $$(basename $$out) ($$(du -h $$out | cut -f1))"
            find /backups -name "$${PGDATABASE}_*.dump" -mtime +$${BACKUP_RETENTION_DAYS} -delete
          else
            echo "[backup] GAGAL pada $$(date -u +%FT%TZ), retry 10 menit lagi"
          fi
          sleep 86400
        done
    networks: [internal]

  # Perpanjang sertifikat Let's Encrypt 2x sehari (sertifikat berlaku 90
  # hari; Let's Encrypt hanya renew kalau sisa < 30 hari).
  # Sertifikat ditulis ke volume yang di-share dengan nginx. Container ini
  # TIDAK me-reload nginx sendiri: `nginx -s reload` di sini akan mencari
  # proses nginx lokal dan tidak menemukannya. Reload ditangani host cron
  # (lihat README bagian "HTTPS").
  certbot:
    image: certbot/certbot:latest
    container_name: paspapan-certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --quiet --webroot -w /var/www/certbot;
        sleep 12h & wait $${!};
      done"
    networks: [internal]

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    driver: bridge
